<script>
/**
 * clan.html — dashboard de un clan (nuevo, 21-sep-2026, pedido usuario).
 * Lee ?clan=NombreDelClan de la URL (mismo parámetro que ya usaba
 * directorio.html?clan=...#roster desde el botón "Ver clan" de Inicio).
 * Combina 3 llamadas ya existentes en el sitio, ninguna nueva del backend:
 *   - webClanInfo:    básico (líder, liga, escudo, links, métricas totales)
 *   - webRoster:      roster completo del clan
 *   - webGuerraEnVivo: resumen de guerra de esta semana + pendientes del clan
 * Alcance "Básico + roster + resumen de guerra de esta semana" acordado
 * con el usuario — sin el sistema de filtros/orden por columna que tiene
 * el roster completo de directorio.html (eso queda disponible desde el
 * link "Ver en el Directorio" de esta misma página).
 * CORRECCIÓN A LO DICHO ANTES (23-sep-2026, pedido explícito del usuario):
 * la exclusión de arriba sigue vigente para el sistema de filtros/orden
 * POR COLUMNA (Rango/Copas/V. Guerra, etc.), pero SÍ se agrega el filtro
 * A-Z/# por primera letra del nombre — mismo patrón que ya usan el roster
 * de directorio.html (#rosterLetraFilter) y las 3 tablas de guerra.html,
 * reusando tal cual pintarFiltroLetra()/LETRAS_FILTRO/primeraLetraFiltro()
 * de assets/js/ui/filters.js (ya cargado en esta página, ver <script> más
 * abajo). Es solo ocultar/mostrar filas ya pintadas por su primera letra,
 * no un sistema de orden/filtro por columna, así que no contradice la
 * exclusión original.
 */
const NOMBRE_CLAN_QUERY = (new URLSearchParams(location.search).get('clan') || '').trim();
// Letra A-Z/# elegida en #clanRosterLetraFilter (ver docblock de arriba, corrección 23-sep-2026). Esta página carga una sola vez (no hay pestañas de clan que resetear), así que no hace falta limpiarla en ningún otro punto.
let clanRosterLetraSeleccionada = null;

function clanCoincide(nombreClan){
  return String(nombreClan || '').trim().toLowerCase() === NOMBRE_CLAN_QUERY.toLowerCase();
}

function mostrarErrorClan(msg){
  document.getElementById('clanCargando').style.display = 'none';
  document.getElementById('clanError').style.display = 'block';
  document.getElementById('clanError').innerHTML = `<div class="msg msg-error">${esc(msg)}</div>`;
}

/** Pinta el bloque "Básico" reutilizando clanCardHtml() (mismo componente
 * que Inicio/Directorio) — sin botones "Ver clan"/"Unirse", ya estamos
 * dentro del dashboard de ese clan. */
function renderClanBasico(clanInfo, idx){
  document.getElementById('clanInfoWrap').innerHTML =
    clanCardHtml(clanInfo, idx, { mostrarVerClan: false, mostrarUnirse: false });
}

/** Pinta el resumen de guerra de esta semana (webGuerraEnVivo), o un
 * mensaje neutro si el backend todavía no tiene datos para este clan
 * (ej. clan sin guerra registrada esta temporada). */
function renderClanGuerra(dataGuerra, nombreClan){
  const wrap = document.getElementById('clanGuerraWrap');
  const ctx = (dataGuerra && dataGuerra.ctx) || {};
  document.getElementById('clanGuerraTitulo').textContent =
    `Resumen de guerra — Temporada ${ctx.temporada ?? '—'}, Semana ${(Number(ctx.sectionIndex) || 0) + 1}`;
  const entradaGuerra = Object.entries(dataGuerra.guerraPorClan || {}).find(([nombre]) => clanCoincide(nombre));
  if (!entradaGuerra){
    wrap.innerHTML = '<div class="empty">Sin datos de guerra registrados para este clan por ahora.</div>';
    return;
  }
  const g = entradaGuerra[1];
  const pendientesClan = (dataGuerra.pendientes || []).filter(p => clanCoincide(p.clan)).length;
  const pct = g.totalHoy ? Math.round((g.atacaron / g.totalHoy) * 100) : 0;
  wrap.innerHTML = `
    <div class="cd-guerra-stats">
      <div class="stat"><b>${fmtNum(g.ataques)}</b><span>Ataques</span></div>
      <div class="stat"><b>${fmtNum(g.fame)}</b><span>Fame</span></div>
      <div class="stat"><b>${fmtNum(g.barcos)}</b><span>Barcos</span></div>
      <div class="stat"><b>${fmtNum(g.atacaron)}/${fmtNum(g.totalHoy)}</b><span>Atacaron hoy (${pct}%)</span></div>
      <div class="stat"><b>${fmtNum(pendientesClan)}</b><span>Pendientes</span></div>
    </div>
    <div style="text-align:center; margin-top:16px;">
      <a href="guerra.html" class="text-dim" style="font-family:var(--f-mono); font-size:12px;">Ver Guerra en vivo &rarr;</a>
    </div>`;
}

/** Pinta la tabla básica del roster del clan (sin filtros/orden, ver
 * docblock de arriba). Reutiliza enlaceJugador() para el nombre, igual
 * que el resto del sitio. */
function renderClanRoster(clanRoster){
  const wrap = document.getElementById('clanRosterWrap');
  const miembros = (clanRoster && clanRoster.miembros) || [];
  document.getElementById('clanVerDirectorioLink').href =
    'directorio.html?clan=' + encodeURIComponent(clanRoster.nombre) + '#roster';
  if (!miembros.length){
    wrap.innerHTML = '<div class="empty">Este clan todavía no tiene miembros registrados.</div>';
    return;
  }
  wrap.innerHTML = `
    <div class="table-scroll">
      <table class="tbl-pendientes">
        <thead><tr>
          <th scope="col">N°</th><th scope="col">Nombre</th><th scope="col">Tag</th>
          <th scope="col">Rango</th><th scope="col">Copas</th><th scope="col">V. Guerra</th><th scope="col">Perfil</th>
        </tr></thead>
        <tbody>${miembros.map((m, i) => {
          const royaleOk = urlValida(m.royaleApi);
          const cwOk = urlValida(m.cwStats);
          const vGuerra = m.vGuerra != null ? m.vGuerra : m.victoriasGuerra;
          return `
            <tr class="js-clan-roster-fila" data-letra="${esc(primeraLetraFiltro(m.nombre))}">
              <td class="col-n">${i + 1}</td>
              <td class="col-nombre">${enlaceJugador(m.nombre, m.tag)}</td>
              <td class="col-tag">${esc(m.tag || '—')}</td>
              <td>${esc(m.rango || '—')}</td>
              <td>${m.copas != null ? fmtNum(m.copas) : '—'}</td>
              <td>${vGuerra != null ? fmtNum(vGuerra) : '—'}</td>
              <td class="col-perfil-icons">${royaleOk ? `<a href="${esc(m.royaleApi)}" target="_blank" rel="noopener" aria-label="RoyaleAPI" title="RoyaleAPI">${ICONO_ROYALEAPI}</a>` : ''}${cwOk ? `<a href="${esc(m.cwStats)}" target="_blank" rel="noopener" aria-label="CWStats" title="CWStats">${ICONO_CWSTATS}</a>` : ''}</td>
            </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;
  activarBarraScrollTabla(wrap.querySelector('.table-scroll'));
  pintarFiltroLetra('clanRosterLetraFilter', LETRAS_FILTRO, () => clanRosterLetraSeleccionada, v => clanRosterLetraSeleccionada = v, aplicarFiltroLetraClanRoster);
}

/** Oculta (display:none) las filas del roster cuya primera letra de nombre no calce con clanRosterLetraSeleccionada; sin letra elegida, se ven todas. Mismo criterio que aplicarFiltroLetraIngresos() de directorio.html, pero sobre <tr> en vez de tarjetas. */
function aplicarFiltroLetraClanRoster(){
  document.querySelectorAll('#clanRosterWrap .js-clan-roster-fila').forEach(fila => {
    fila.style.display = (!clanRosterLetraSeleccionada || fila.dataset.letra === clanRosterLetraSeleccionada) ? '' : 'none';
  });
}

async function cargarClan(){
  if (!NOMBRE_CLAN_QUERY){
    mostrarErrorClan('Falta el nombre del clan en el link (?clan=...).');
    return;
  }
  try{
    const [dataInfo, dataRoster, dataGuerra] = await Promise.all([
      apiGet('webClanInfo', null, { ttlMs: 300000, staleIfError: true }),
      apiGet('webRoster', null, { ttlMs: 300000, staleIfError: true }),
      apiGet('webGuerraEnVivo', null, { ttlMs: 120000, staleIfError: true })
    ]);
    const clanesInfo = ordenarClanes(dataInfo.clanes || []);
    const idx = clanesInfo.findIndex(c => clanCoincide(c.nombre));
    if (idx < 0){
      mostrarErrorClan('No se encontró este clan.');
      return;
    }
    const clanInfo = clanesInfo[idx];
    document.title = `${clanInfo.nombre || 'Clan'} — Familia Terna`;

    const clanRoster = (dataRoster.clanes || []).find(c => clanCoincide(c.nombre)) || { nombre: clanInfo.nombre, miembros: [] };

    document.getElementById('clanCargando').style.display = 'none';
    document.getElementById('clanContenido').style.display = 'block';
    document.getElementById('clanActualizadoTxt').textContent =
      fmtTiempoRelativo(apiGetUltimaActualizacion('webClanInfo', null));

    renderClanBasico(clanInfo, idx);
    renderClanGuerra(dataGuerra || {}, clanInfo.nombre);
    renderClanRoster(clanRoster);
  }catch(err){
    mostrarErrorClan('Error de conexión: ' + err.message);
  }
}
cargarClan();
</script>
