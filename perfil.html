<!--
  PERFIL.HTML (31-ago-2026, pedido usuario)
  "Cuando abro el perfil de un jugador, no basta con cambiar el link,
  también debe verse un menú dedicado para eso. Actualmente es solo una
  sección que se despliega dentro del mismo panel de clanes, pero debe
  mostrarse en otra pestaña el perfil, con mayor detalle."

  Página nueva, independiente de jugadores.html: todo lo que antes se
  desplegaba inline dentro de la sección #miembroSec de jugadores.html
  (cabecera, progreso de ascenso/descenso, estadísticas extendidas,
  torneos del jugador, "ver otras cuentas" y "vetar", todo admin-only
  donde corresponde) vive ahora acá, en su propia pestaña, a partir de
  ?tag=TAG en la URL. jugadores.html ya NO renderiza el perfil inline:
  simplemente resuelve el tag (directo, o por selección entre
  coincidencias) y abre esta página con window.open(...,'_blank').

  Además se agrega una sección nueva que no existía: "Ranking en el clan"
  a lo largo del tiempo (pedido: "se puede hacer una gráfica de ranking en
  el clan, porque eso se guarda en la hoja Guerra").
  RESUELTO (04-sep-2026, pedido usuario — "en el sector de Ranking del
  clan, falta corregir porque la información diaria sí está en Sheets,
  hoja Guerra"): 'webPerfil' (_webPerfilJugador(), 34_Web_API.gs) ya manda
  ext.historialRanking = [{semana, ranking}, ...], leído fila por fila de
  la hoja Guerra (columna Ranking, GC.RANKING) para el Tag del jugador.
  Como Guerra solo retiene la temporada actual (el resto se purga a
  Backup_Guerra.csv), el historial cubre los días ya jugados de la
  temporada en curso, no temporadas completas anteriores. Si un jugador
  todavía no tiene ningún día con Ranking registrado (recién ingresado, o
  ninguna guerra jugada todavía esta temporada), esta sección sigue
  mostrando el mensaje de "todavía no hay historial" en vez de una gráfica
  vacía (ver renderRankingChart() más abajo).
-->
<style>
  .perfil-cabecera{display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;}
  /* FIX (04-sep-2026, pedido usuario — "falta centrar los datos de los
   * cuadritos y esto también" [refiriéndose a esta fila de stats-mini de la
   * cabecera]): cada <span> pasa a ser una columna centrada (texto y el

   * dentro de su ancho de contenido. */

  .perfil-cabecera .stats-mini span{display:flex; flex-direction:column; align-items:center;}
  .perfil-cabecera .stats-mini b{color:var(--text); font-size:16px; display:block; font-family:var(--f-display);}
  .req-row{display:flex; align-items:center; gap:12px; margin-bottom:12px; flex-wrap:wrap;}

  .req-row .progress{flex:1; min-width:120px;}
  .req-row .val{min-width:110px; width:auto; text-align:right; font-family:var(--f-mono); font-size:12px; flex-shrink:0; white-space:nowrap;}
  .ext-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:14px; margin-top:16px;}
  /* FIX (04-sep-2026, pedido usuario — "falta centrar los datos de los
   * cuadritos"): .ext-item pasa de text-align:left a center, así el valor

  .ext-item{background:var(--bg-2); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px 14px; text-align:center;}
  .ext-item .v{font-family:var(--f-display); font-weight:800; font-size:19px; color:var(--text);}
  .ext-item .k{font-family:var(--f-mono); font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
  /* FIX (02-sep-2026, pedido usuario — "en el punto 7 se debía quitar la
   * segunda fila, no la primera, es decir mover los nuevos botones a la
   * primera fila, siguiendo el formato que tenía la primera fila; ahora

   * .ext-links vuelve a ser la ÚNICA fila de acciones del perfil (antes
   * era el estilo "chico" que se quitó por error el 01-sep-2026 pensando

   * además de `a`, porque ahora esta misma fila también contiene los
   * botones Vetar/Ver torneos/Ver otras cuentas (antes en su fila aparte
   * con clase .btn.btn-ghost, el formato "feo" que había que quitar) —
   * ver renderMiembro() más abajo, donde se arma toda la fila junta.
   */
  .ext-links{display:flex; gap:14px; margin-top:18px; flex-wrap:wrap;}
  .ext-links a, .ext-links button{
    font-family:var(--f-mono); font-size:12px; font-weight:600; color:var(--purple-light);
    border:1px solid var(--line); padding:8px 14px; border-radius:var(--radius-sm); text-decoration:none;
    background:transparent; cursor:pointer; transition:all .18s ease;
  }
  .ext-links a:hover, .ext-links button:hover{border-color:var(--purple); background:rgba(162,57,255,.1); color:var(--purple-light);}
  .ingreso-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:14px 18px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:var(--surface-card); margin-bottom:10px; transition:all .18s ease;
  }
  .ingreso-row:last-child{margin-bottom:0;}
  .ingreso-row:hover{border-color:var(--line-strong); transform:translateY(-2px); cursor:pointer;}
  .ingreso-info .ing-nombre{font-weight:700; font-size:14px; color:var(--text);}
  .ingreso-info .ing-fecha{font-family:var(--f-mono); font-size:11px; color:var(--text-faint); margin-top:3px;}
  .ingreso-links{display:flex; gap:8px; flex-wrap:wrap;}
  .field textarea{
    width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--text);
    padding:13px 16px; border-radius:var(--radius-sm); font-family:var(--f-body); font-size:15px;
    transition:all .18s ease; min-height:90px; resize:vertical;
  }
  .field textarea:focus{border-color:var(--purple); box-shadow:0 0 0 3px rgba(162,57,255,.2); outline:none;}
  .vetar-form{border:1px solid var(--line); border-radius:var(--radius-sm); padding:16px; background:var(--surface);}
  .vetar-form-titulo{font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--danger); margin-bottom:14px;}
  .ranking-chart-empty{font-family:var(--f-mono); font-size:12px; color:var(--text-faint); padding:18px 4px;}
</style>

<script src="assets/common.js"></script>
<script>
const TAG_PERFIL = normalizarTag(new URLSearchParams(location.search).get('tag') || '');

/** Fecha corta "DD-mmm" (ej. "27-ago") para "Vigencia" — mismo patrón que
 * fmtDiaMes() de guerra.html. Si el valor no es una fecha parseable (el
 * backend podría mandar ya un texto formateado), se muestra tal cual en
 * vez de "—", para no perder información. */
function fmtFechaCorta(v){
  if (!v) return '—';
  const d = v instanceof Date ? v : new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return d.toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' });
}

function campoMinTSegunRango(rango){
  const r = String(rango||'').toLowerCase();
  if(r.includes('col')) return 'minTColider';
  if(r.includes('vet')) return 'minTVeterano';
  return 'minTMiembro';
}
function barraRequisito(lbl, actual, requerido, activo, sufijo){
  if(!activo) return '';
  const pct = requerido > 0 ? Math.min(100, Math.round((actual/requerido)*100)) : 100;
  const cumplido = actual >= requerido;
  return `
    <div class="req-row">
      <div class="lbl">${esc(lbl)}</div>
      <div class="progress${cumplido?' complete':''}"><i style="width:${pct}%"></i></div>
      <div class="val">${fmtNum(actual)} / ${fmtNum(requerido)}${sufijo||''}</div>
    </div>`;
}
function bloqueRequisitos(j, key){
  const req = j.progreso ? j.progreso[key] : null;
  if (!req) return '';
  const campoMinT = campoMinTSegunRango(j.rango);
  const minT = req[campoMinT];
  let html = '';
  if (minT) html += barraRequisito('Trofeos guerra', minT.actual, minT.requerido, minT.activo, '🏆');
  if (req.ataques) html += barraRequisito('Ataques/semana', req.ataques.actual, req.ataques.requerido, req.ataques.activo, '');
  if (req.torneos) html += barraRequisito('Torneos', req.torneos.actual, req.torneos.requerido, req.torneos.activo, '');
  if (req.reaccion && req.reaccion.activo) html += `<div style="margin-top:8px;"><span class="badge badge-purple">Requiere reaccionar a la publicación</span></div>`;
  return html;
}
function extItem(valor, label, esNumero){
  if (valor === undefined || valor === null || valor === '') return '';
  const txt = esNumero ? fmtNum(valor) : String(valor);
  return `<div class="ext-item"><div class="v">${esc(txt)}</div><div class="k">${esc(label)}</div></div>`;
}
function renderExtendido(ext){
  const wrap = document.getElementById('mExtWrap');
  if (!ext){ wrap.innerHTML = ''; return; }
  let items = '';
  items += extItem(ext.nivelXp, 'Nivel', true);
  items += extItem(ext.nivelCartas, 'Nivel de cartas', true);
  items += extItem(ext.copasMax, 'Copas máx.', true);
  items += extItem(ext.arena, 'Arena', false);
  items += extItem(ext.victorias, 'Victorias', true);
  items += extItem(ext.derrotas, 'Derrotas', true);
  items += extItem(ext.batallas, 'Batallas', true);
  items += extItem(ext.racha, 'Racha', true);
  items += extItem(ext.victorias3Coronas, '3 coronas', true);
  items += extItem(ext.maxVictoriasDesafios, 'Máx. victorias desafío', true);
  items += extItem(ext.cartasDesafios, 'Cartas de desafíos', true);
  items += extItem(ext.cartasTorneos, 'Cartas de torneos', true);
  items += extItem(ext.emotes, 'Emotes', true);
  items += extItem(ext.banners, 'Banners', true);
  items += extItem(ext.donacionesRecibidas, 'Donac. recibidas', true);
  items += extItem(ext.donacionesRealizadas, 'Donac. hechas', true);
  items += extItem(ext.rankingClan, 'Ranking en el clan', true);

  let camino = '';
  if (ext.caminoLeyendas){
    const cl = ext.caminoLeyendas;
    const partes = [cl.liga, cl.trofeos, cl.rango].filter(v => v !== undefined && v !== null && v !== '');
    if (partes.length) camino = `<div style="margin-top:16px;"><span class="badge badge-gold">🏔️ Camino de Leyendas · ${partes.map(esc).join(' · ')}</span></div>`;
  }

  /* FIX (01-sep-2026, pedido usuario — "se muestra dos veces la fila de
   * botones"): esta sección llegó a armar su propia fila chica de enlaces
   * (RoyaleAPI/CWStats/Mazo/Mazo2, clase .ext-links) por separado de la
   * fila de acciones principal (#mRoyaleCwstatsBtns + Vetar/Ver torneos/
   * Ver otras cuentas, ver renderMiembro() más abajo), duplicando la fila
   * completa en pantalla. Se quita de acá (renderExtendido solo pinta la
   * grilla de estadísticas y el badge de Camino de Leyendas); los 4 links
   * (RoyaleAPI/CWStats/Mazo/Mazo2) y los botones de acción se pintan
   * juntos, en una sola fila con el formato .ext-links, en renderMiembro().
   */
  wrap.innerHTML = (items ? `<div class="ext-grid">${items}</div>` : '') + camino;
}

/**
 * renderRankingChart(ext)
 * Gráfica de línea simple con la evolución del ranking en el clan.
 * Necesita `ext.historialRanking` = [{semana, ranking}, ...] (más
 * reciente al final o al principio, no importa el orden: se reordena
 * acá). Si el backend todavía no manda ese campo (ver comentario al
 * inicio del archivo), se muestra un mensaje en vez de una gráfica vacía.
 */
function renderRankingChart(ext){
  const wrap = document.getElementById('mRankingChart');
  const historial = ext && Array.isArray(ext.historialRanking) ? ext.historialRanking.filter(h => h && h.ranking != null) : [];
  if (!historial.length){
    wrap.innerHTML = `<div class="ranking-chart-empty">
      Todavía no hay historial de ranking disponible para graficar${ext && ext.rankingClan != null ? ` — ranking actual: <b style="color:var(--text);">#${esc(String(ext.rankingClan))}</b>` : ''}.
    </div>`;
    return;
  }
  const ordenados = historial.slice().sort((a,b) => String(a.semana).localeCompare(String(b.semana)));
  const valores = ordenados.map(h => Number(h.ranking));
  const max = Math.max(...valores), min = Math.min(...valores);
  const W = 640, H = 200, PAD = 28;
  const stepX = ordenados.length > 1 ? (W - PAD*2) / (ordenados.length - 1) : 0;
  const escalaY = v => {
    if (max === min) return H/2;
    // Ranking: 1 es el MEJOR puesto, así que el eje se invierte (menor = más arriba).
    return PAD + ((v - min) / (max - min)) * (H - PAD*2);
  };
  const puntos = valores.map((v,i) => `${PAD + i*stepX},${escalaY(v)}`).join(' ');
  const etiquetas = ordenados.map(h => esc(String(h.semana)));
  wrap.innerHTML = `
    <svg viewBox="0 0 ${W} ${H+24}" style="width:100%; height:auto; margin-top:8px;">
      <polyline points="${puntos}" fill="none" stroke="var(--purple-light, #c084fc)" stroke-width="2.5"/>
      ${valores.map((v,i) => `<circle cx="${PAD + i*stepX}" cy="${escalaY(v)}" r="4" fill="var(--purple-light, #c084fc)"/>`).join('')}
      ${valores.map((v,i) => `<text x="${PAD + i*stepX}" y="${H+18}" font-size="10" fill="var(--text-faint,#888)" text-anchor="middle" font-family="var(--f-mono)">${etiquetas[i]}</text>`).join('')}
    </svg>
    <div class="text-faint" style="font-family:var(--f-mono); font-size:11px; margin-top:4px;">Menor número = mejor puesto en el clan.</div>`;
}

// adminPuedeVetar() ahora vive en assets/common.js (1-sep-2026, reutilizada
// también por la vista de cuentas inactivas) — se quita el duplicado local.

function renderMiembro(j){
  document.title = `${j.nombre || 'Jugador'} — Familia Terna`;
  document.getElementById('mNombre').textContent = j.nombre || 'Sin nombre';
  document.getElementById('mSub').textContent = `${j.tag} · ${j.clan || '—'} · ${j.rango || '—'} · ${j.estado || '—'}`;
  document.getElementById('mCopas').textContent = fmtNum(j.copas);
  document.getElementById('mVGuerra').textContent = fmtNum(j.vGuerra);
  document.getElementById('mTorneos').textContent = fmtNum(j.torneos);
  document.getElementById('mAtaques').textContent = fmtNum(j.guerraSemana && j.guerraSemana.ataques);

  // FIX (03-sep-2026, pedido usuario — "Vigencia" / Última conexión, dato
  // de la hoja Directorio): se acepta tanto `j.vigencia` como
  // `j.extendido.vigencia`/`j.extendido.ultimaConexion` — se usa el primero
  // que venga con valor. Si ninguno viene, el <span> se queda oculto
  // (display:none puesto en el HTML) en vez de mostrar un campo vacío.
  // CONFIRMADO (04-sep-2026): el backend (`_webPerfilJugador()`,
  // 34_Web_API.gs) ya manda `j.vigencia` (columna DC.VIGENCIA de
  // Directorio), así que este bloque ya no depende de una futura conexión.
  const vigenciaWrap = document.getElementById('mVigenciaWrap');
  const vigenciaRaw = j.vigencia ?? (j.extendido && (j.extendido.vigencia ?? j.extendido.ultimaConexion));
  if (vigenciaRaw){
    document.getElementById('mVigencia').textContent = fmtFechaCorta(vigenciaRaw);
    vigenciaWrap.style.display = '';
  } else {
    vigenciaWrap.style.display = 'none';
  }

  // FIX (04-sep-2026, pedido usuario — "los espacios son desiguales" entre
  // las barras de Ascensos/Descensos): antes se unían los bloques con un
  // separador extra de 14px (`<div style="height:14px;">`), que se SUMABA
  // al margin-bottom:12px que ya trae cada .req-row (ver <style>), dejando
  // 26px entre el último renglón de un bloque y el primero del siguiente,
  // contra 12px entre renglones de un mismo bloque. Se quita el separador
  // extra: el margin-bottom:12px de .req-row ya es uniforme para TODOS los
  // renglones, sean del mismo bloque o no.
  const bloques = ['ascensos', 'descensos'].map(key => bloqueRequisitos(j, key)).filter(Boolean);
  document.getElementById('mReqContenido').innerHTML = bloques.length
    ? bloques.join('')
    : '<div class="empty">Este clan todavía no tiene requisitos configurados.</div>';

  renderExtendido(j.extendido);
  renderRankingChart(j.extendido);

  // FIX (31-ago-2026, pedido usuario — "en los perfiles de jugadores,
  // antes de ver torneos, agrega el botón con el link al perfil de
  // royaleapi y otro a cwstats"): botones dedicados en la fila de
  // acciones, con los íconos oficiales.
  // FIX (1-sep-2026, pedido usuario — "también debería haber botones de
  // Mazos para aprovechar las columnas Mazo y Mazo2"): mismos botones,
  // mismo estilo, para los 2 mazos sugeridos (ext.deck/ext.deck2).
  // FIX (02-sep-2026, pedido usuario — "se debía quitar la segunda fila,
  // no la primera; mover los nuevos botones a la primera fila, siguiendo
  // el formato que tenía la primera fila"): estos 4 links ya NO usan las
  // clases .btn.btn-ghost (la fila "grande" que había que quitar) — ahora
  // son <a> simples dentro de #mAccionesRow (clase .ext-links, ver <style>
  // y el HTML de esta sección), así que heredan el estilo de la fila
  // "chica" original, junto con Vetar/Ver torneos/Ver otras cuentas.
  const ext = j.extendido || {};
  const royaleOkBtn = urlValida(ext.royaleApi);
  const cwOkBtn = urlValida(ext.cwStats);
  const deckOkBtn = urlValida(ext.deck);
  const deck2OkBtn = urlValida(ext.deck2);
  // FIX (04-sep-2026, pedido usuario — "los botones pueden confundir, se
  // debe cambiar el nombre a 'Sugerencias de mazo' y 'Sugerencias de mazo
  // (2)' para que no se malentienda que muestran el mazo actual [del
  // jugador]"): ambos abren RoyaleAPI con búsquedas de mazos ya filtradas
  // según las cartas desbloqueadas de esa cuenta — NO son "el mazo que el
  // jugador está usando ahora", así que el nombre anterior ("Mazo"/
  // "Mazo 2") se prestaba a esa confusión. Se agrega además un `title`
  // (tooltip nativo al pasar el mouse) explicando la diferencia entre los
  // dos: el primero (ext.deck) fuerza incluir las cartas que sí tiene y
  // excluye las que no, sin mirar nivel; el segundo (ext.deck2) solo
  // excluye las que no tiene desbloqueadas, sin forzar cuáles incluir ni
  // mirar nivel tampoco — por eso puede sugerir mazos con cartas de nivel
  // bajo mezcladas con cartas al máximo.
  const deckTitle = 'Búsqueda en RoyaleAPI de mazos que solo usan cartas que esta cuenta tiene desbloqueadas, forzando la inclusión de esas cartas (no distingue el nivel de cada carta).';
  const deck2Title = 'Búsqueda en RoyaleAPI de mazos que solo usan cartas que esta cuenta tiene desbloqueadas, sin forzar cuáles incluir (no distingue el nivel de cada carta, puede mezclar cartas al máximo con cartas de nivel bajo).';
  document.getElementById('mRoyaleCwstatsBtns').innerHTML = `
    ${royaleOkBtn ? `<a href="${esc(ext.royaleApi)}" target="_blank" rel="noopener">${ICONO_ROYALEAPI}RoyaleAPI</a>` : ''}
    ${cwOkBtn ? `<a href="${esc(ext.cwStats)}" target="_blank" rel="noopener">${ICONO_CWSTATS}CWStats</a>` : ''}
    ${deckOkBtn ? `<a href="${esc(ext.deck)}" target="_blank" rel="noopener" title="${esc(deckTitle)}">🃏 Sugerencias de mazo</a>` : ''}
    ${deck2OkBtn ? `<a href="${esc(ext.deck2)}" target="_blank" rel="noopener" title="${esc(deck2Title)}">🃏 Sugerencias de mazo (2)</a>` : ''}`;

  document.getElementById('btnVerTorneosJugador').dataset.tag = j.tag;
  const btnOtras = document.getElementById('btnVerOtrasCuentas');
  btnOtras.style.display = esAdminLogueado() ? 'inline-flex' : 'none';
  btnOtras.dataset.tag = j.tag;
  // FASE 2 (04-sep-2026): mismo criterio de visibilidad que "Ver otras
  // cuentas" — cualquier admin con sesión iniciada, sin Función especial.
  const btnHistGuerra = document.getElementById('btnVerHistorialGuerra');
  btnHistGuerra.style.display = esAdminLogueado() ? 'inline-flex' : 'none';
  btnHistGuerra.dataset.tag = j.tag;
  const btnVetar = document.getElementById('btnVetarJugador');
  btnVetar.style.display = adminPuedeVetar() ? 'inline-flex' : 'none';
  btnVetar.dataset.tag = j.tag;

  document.getElementById('perfilCargando').style.display = 'none';
  document.getElementById('perfilContenido').style.display = 'block';
}

async function verTorneosJugador(tag){
  const wrap = document.getElementById('mTorneosWrap');
  wrap.style.display = 'block';
  wrap.innerHTML = '<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">Cargando torneos…</div>';
  try{
    const data = await apiGet('webTorneosJugador', { tag });
    const torneos = (data && data.torneos) || [];
    if (!torneos.length){
      wrap.innerHTML = '<div class="empty">Este jugador no tiene participación registrada en torneos.</div>';
      return;
    }
    wrap.innerHTML = `<div class="card" style="padding:8px 4px;">${torneos.map(t => `
      <div class="ingreso-row" style="cursor:default;">
        <div class="ingreso-info">
          <div class="ing-nombre">Torneo ${esc(String(t.idTorneo))}</div>
          <div class="ing-fecha">${t.clan ? esc(t.clan) + ' · ' : ''}${t.fecha ? esc(t.fecha) : 'Fecha no registrada'}</div>
        </div>
        <div class="ingreso-links">
          ${t.puesto ? `<span class="badge badge-gold">Puesto ${esc(String(t.puesto))}</span>` : ''}
          ${t.victorias !== undefined ? `<span class="badge badge-purple">${fmtNum(t.victorias)} victorias</span>` : ''}
        </div>
      </div>`).join('')}</div>`;
  }catch(err){
    wrap.innerHTML = `<div class="empty">No se pudo cargar los torneos de este jugador: ${esc(err.message)}</div>`;
  }
}
document.getElementById('btnVerTorneosJugador').addEventListener('click', function(){
  verTorneosJugador(this.dataset.tag);
});

/** Clic en "otra cuenta" abre SU perfil en una pestaña nueva propia,
 * consistente con el resto del sitio (ya no navega dentro de la misma
 * página como hacía jugadores.html). */
async function verOtrasCuentas(tag){
  const wrap = document.getElementById('mOtrasCuentasWrap');
  wrap.innerHTML = '<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">Buscando cuentas con el mismo celular…</div>';
  try{
    const data = await apiGetAuth('webAdminOtrasCuentas', { tag });
    const cuentas = (data && data.cuentas) || [];
    if (!cuentas.length){
      wrap.innerHTML = '<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">No se encontraron otras cuentas con el mismo celular.</div>';
      return;
    }
    wrap.innerHTML = `<div class="card" style="padding:8px 4px;">${cuentas.map(c => `
      <div class="ingreso-row js-otra-cuenta" data-tag="${esc(c.tag)}">
        <div class="ingreso-info">
          <div class="ing-nombre">${esc(c.nombre)}</div>
          <div class="ing-fecha">${esc(c.tag)} · ${esc(c.clan || '—')}</div>
        </div>
      </div>`).join('')}</div>`;
    wrap.querySelectorAll('.js-otra-cuenta').forEach(row => {
      row.addEventListener('click', () => window.open('perfil.html?tag=' + encodeURIComponent(row.dataset.tag), '_blank'));
    });
  }catch(err){
    wrap.innerHTML = `<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">No se pudo cargar: ${esc(err.message)}</div>`;
  }
}
document.getElementById('btnVerOtrasCuentas').addEventListener('click', function(){
  verOtrasCuentas(this.dataset.tag);
});

/**
 * verHistorialGuerra(tag)
 * FASE 2 (04-sep-2026, pedido del usuario, punto 1 del documento de
 * cambios): tabla con el historial COMPLETO de guerra del jugador (todas
 * las Temporada+Semana guardadas, no solo la actual) — solo admins.
 * Ver _webHistorialGuerraJugador() (21_HistorialGuerraJugador.gs).
 *
 * OJO — el dato base es semanal (Temporada/Semana), no día por día. La
 * columna "Fecha" (FASE 2, 04-sep-2026, resolución del punto 2 pendiente)
 * viene resuelta por el backend cruzando con Backup_Guerra.csv — ver
 * _obtenerFechaCierrePorTemporadaSemana() (21_HistorialGuerraJugador.gs).
 * Puede salir vacía si esa semana no tiene ninguna fila registrada para
 * este tag en ese CSV (ej. temporadas muy viejas ya purgadas).
 */
async function verHistorialGuerra(tag){
  const wrap = document.getElementById('mHistorialGuerraWrap');
  wrap.style.display = 'block';
  wrap.innerHTML = '<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">Cargando historial de guerra…</div>';
  try{
    const data = await apiGetAuth('webHistorialGuerraJugador', { tag });
    if (!data || !data.ok){
      wrap.innerHTML = `<div class="empty">${esc((data && data.error) || 'No se pudo cargar el historial.')}</div>`;
      return;
    }
    const registros = data.registros || [];
    if (!registros.length){
      wrap.innerHTML = '<div class="text-faint" style="font-family:var(--f-mono); font-size:12px;">Todavía no hay historial de guerra guardado para esta cuenta.</div>';
      return;
    }
    wrap.innerHTML = `<div class="card" style="padding:8px 4px; overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; font-family:var(--f-mono); font-size:12px;">
        <thead>
          <tr style="text-align:left; color:var(--text-dim);">
            <th style="padding:6px 8px;">Fecha</th>
            <th style="padding:6px 8px;">Temporada</th>
            <th style="padding:6px 8px;">Semana</th>
            <th style="padding:6px 8px;">Clan</th>
            <th style="padding:6px 8px;">Ataques</th>
            <th style="padding:6px 8px;">Puntaje</th>
            <th style="padding:6px 8px;">Barcos</th>
            <th style="padding:6px 8px;">Comentario</th>
          </tr>
        </thead>
        <tbody>
          ${registros.map(r => `
          <tr style="border-top:1px solid var(--border);">
            <td style="padding:6px 8px;">${esc(r.fecha || '—')}</td>
            <td style="padding:6px 8px;">${esc(String(r.temporadaInterna ?? '—'))}</td>
            <td style="padding:6px 8px;">${esc(String(r.semana ?? '—'))}</td>
            <td style="padding:6px 8px;">${esc(r.clan || '—')}</td>
            <td style="padding:6px 8px;">${r.ataques == null ? '—' : fmtNum(r.ataques)}</td>
            <td style="padding:6px 8px;">${r.fame == null ? '—' : fmtNum(r.fame)}</td>
            <td style="padding:6px 8px;">${r.barcos == null ? '—' : fmtNum(r.barcos)}</td>
            <td style="padding:6px 8px; color:var(--text-dim);">${esc(r.comentario || '—')}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }catch(err){
    wrap.innerHTML = `<div class="empty">No se pudo cargar el historial de guerra: ${esc(err.message)}</div>`;
  }
}
document.getElementById('btnVerHistorialGuerra').addEventListener('click', function(){
  verHistorialGuerra(this.dataset.tag);
});

function mostrarFormVetar(tag){
  const wrap = document.getElementById('mVetarWrap');
  const yaAbierto = wrap.style.display !== 'none' && wrap.innerHTML;
  if (yaAbierto){
    wrap.style.display = 'none';
    wrap.innerHTML = '';
    return;
  }
  wrap.innerHTML = `
    <div class="vetar-form">
      <div class="vetar-form-titulo">Vetar a ${esc(tag)}</div>
      <div class="field">
        <label for="vjRazon">Razón</label>
        <select id="vjRazon">
          <option value="">Elige una razón…</option>
          <option value="NARANJA x">NARANJA x</option>
          <option value="Vetado por clan">Vetado por clan</option>
          <option value="Incumplimiento de ataques">Incumplimiento de ataques</option>
          <option value="Conducta inapropiada">Conducta inapropiada</option>
          <option value="Inactividad prolongada">Inactividad prolongada</option>
          <option value="Solicitud propia">Solicitud propia</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:8px;">
        <label for="vjComentario">Comentario (opcional)</label>
        <textarea id="vjComentario" rows="4" placeholder="Detalle adicional para el registro de Comentarios"></textarea>
      </div>
      <button type="button" class="btn btn-primary btn-block" id="btnVjConfirmar" style="border-color:var(--danger);">Confirmar veto</button>
      <div id="vjMsg"></div>
    </div>`;
  wrap.style.display = 'block';
  document.getElementById('btnVjConfirmar').addEventListener('click', () => enviarVeto(tag));
}
async function enviarVeto(tag){
  const msgEl = document.getElementById('vjMsg');
  msgEl.innerHTML = '';
  const razon = document.getElementById('vjRazon').value;
  const comentario = document.getElementById('vjComentario').value.trim();
  if (!razon){ msgEl.innerHTML = '<div class="msg msg-error">Elige una Razón.</div>'; return; }
  if (!window.confirm(`¿Vetar a ${tag}? Esta acción no se puede deshacer desde la web.`)) return;
  const btnConfirmar = document.getElementById('btnVjConfirmar');
  btnConfirmar.disabled = true;
  try{
    const data = await apiPost('webAdminVetar', {
      sessionToken: sessionStorage.getItem('terna_admin_token'),
      datos: { tag: tag, razon: razon, comentario: comentario }
    });
    if (data && data.ok === false && /sesión|sesion/i.test(String(data.error||''))){
      msgEl.innerHTML = `<div class="msg msg-error">${esc(data.error)} Vuelve a iniciar sesión desde el panel de admin.</div>`;
      document.getElementById('btnVetarJugador').style.display = 'none';
      return;
    }
    if (!data.ok){ msgEl.innerHTML = `<div class="msg msg-error">${esc(data.error)}</div>`; btnConfirmar.disabled = false; return; }
    msgEl.innerHTML = '<div class="msg msg-ok">Miembro vetado.</div>';
    const btnVetar = document.getElementById('btnVetarJugador');
    btnVetar.disabled = true;
    btnVetar.textContent = '🚫 Vetado';
  }catch(err){
    msgEl.innerHTML = `<div class="msg msg-error">Error de conexión: ${esc(err.message)}</div>`;
    btnConfirmar.disabled = false;
  }
}
document.getElementById('btnVetarJugador').addEventListener('click', function(){
  mostrarFormVetar(this.dataset.tag);
});

async function cargarPerfil(){
  if (!TAG_PERFIL){
    document.getElementById('perfilCargando').style.display = 'none';
    document.getElementById('perfilError').style.display = 'block';
    document.getElementById('perfilError').innerHTML = '<div class="msg msg-error">Falta el Tag del jugador en el link (?tag=...).</div>';
    return;
  }
  try{
    const data = await apiGet('webPerfil', { tag: TAG_PERFIL });
    if (!data.ok){
      document.getElementById('perfilCargando').style.display = 'none';
      document.getElementById('perfilError').style.display = 'block';
      document.getElementById('perfilError').innerHTML = `<div class="msg msg-error">${esc(data.error || 'No se encontró este jugador.')}</div>`;
      return;
    }
    renderMiembro(data.jugador);
  }catch(err){
    document.getElementById('perfilCargando').style.display = 'none';
    document.getElementById('perfilError').style.display = 'block';
    document.getElementById('perfilError').innerHTML = `<div class="msg msg-error">Error de conexión: ${esc(err.message)}</div>`;
  }
}
cargarPerfil();
</script>
